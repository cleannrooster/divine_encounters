plugins {
    id 'com.gradleup.shadow'
}

architectury {
    platformSetupLoomIde()
    neoForge()
}

configurations {
    common {
        canBeResolved = true
        canBeConsumed = false
    }
    compileClasspath.extendsFrom common
    runtimeClasspath.extendsFrom common
    developmentNeoForge.extendsFrom common

    shadowBundle {
        canBeResolved = true
        canBeConsumed = false
    }
}

repositories {
    maven {
        name = 'NeoForged'
        url = 'https://maven.neoforged.net/releases'
    }
}

dependencies {
    neoForge "net.neoforged:neoforge:$rootProject.neoforge_version"

    // Architectury API (NeoForge variant)
    modImplementation "dev.architectury:architectury-neoforge:$rootProject.architectury_api_version"

    // GeckoLib (NeoForge)
    modImplementation "software.bernie.geckolib:geckolib-neoforge-${rootProject.minecraft_version}:${rootProject.geckolib_version}"

    // 1.21.1 is obfuscated: depend on :common's remap-transform variant and bundle it into the shadow jar.
    common(project(path: ':common', configuration: 'namedElements')) { transitive = false }
    shadowBundle project(path: ':common', configuration: 'transformProductionNeoForge')
}

processResources {
    inputs.property 'version', project.version
    inputs.property 'mod_id', rootProject.mod_id
    inputs.property 'mod_name', rootProject.mod_name

    filesMatching('META-INF/neoforge.mods.toml') {
        expand(
                // Strip the "+<mc version>" build metadata: NeoForge's Maven version parser rejects '+'.
                version: project.version.toString().split('\\+')[0],
                mod_id: rootProject.mod_id,
                mod_name: rootProject.mod_name,
                minecraft_version: rootProject.minecraft_version,
                neoforge_version: rootProject.neoforge_version
        )
    }
}

shadowJar {
    configurations = [project.configurations.shadowBundle]
    archiveClassifier = 'dev-shadow'
}

remapJar {
    input.set shadowJar.archiveFile
    archiveClassifier = null
    dependsOn shadowJar
}
